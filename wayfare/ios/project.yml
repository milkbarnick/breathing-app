# XcodeGen spec for Wayfare. Generate the Xcode project with:
#   cd wayfare/ios && xcodegen
# The generated Wayfare.xcodeproj is disposable: edit this file, not the project.

name: Wayfare

options:
  bundleIdPrefix: com.wayfare
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  developmentLanguage: en

# API_BASE_URL, DEVELOPMENT_TEAM and the version numbers live in Config.xcconfig.
configFiles:
  Debug: Config.xcconfig
  Release: Config.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic

targets:
  Wayfare:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Wayfare
    info:
      path: Wayfare/Info.plist
      properties:
        CFBundleDisplayName: Wayfare
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # Read at runtime by AppConfig. Set API_BASE_URL in Config.xcconfig.
        APIBaseURL: "$(API_BASE_URL)"
        CFBundleURLTypes:
          - CFBundleURLName: com.wayfare.app
            CFBundleTypeRole: Viewer
            CFBundleURLSchemes:
              - wayfare
        UIBackgroundModes:
          - remote-notification
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIRequiresFullScreen: false
        ITSAppUsesNonExemptEncryption: false
        # No location keys on purpose: MKLocalSearch works without location permission,
        # and the map never asks for the user's location.
    entitlements:
      path: Wayfare/Wayfare.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
        # Xcode switches this to "production" when you export an App Store / TestFlight build.
        aps-environment: development
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wayfare.app
        PRODUCT_NAME: Wayfare
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG

  WayfareTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: WayfareTests
    dependencies:
      - target: Wayfare
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.wayfare.app.tests
        # TEST_HOST / BUNDLE_LOADER are set by XcodeGen because this target depends on the app.

schemes:
  Wayfare:
    build:
      targets:
        Wayfare: all
        WayfareTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - WayfareTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
