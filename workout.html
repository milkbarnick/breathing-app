<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Workout Planner</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f0f13;
      --surface: #1a1a24;
      --surface2: #252535;
      --border: #2e2e42;
      --accent: #6c63ff;
      --accent-dim: rgba(108,99,255,0.18);
      --text: #e8e8f0;
      --text2: #9090a8;
      --success: #4ade80;
      --danger: #f87171;
      --radius: 10px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ---- Header ---- */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 1.25rem;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
      flex-shrink: 0;
    }

    .logo { font-size: 1.15rem; font-weight: 700; color: var(--accent); }

    /* ---- Desktop nav ---- */
    .desk-nav { display: flex; gap: 0.25rem; }
    .desk-nav button {
      background: none; border: none; color: var(--text2);
      padding: 0.45rem 0.85rem; border-radius: 8px;
      cursor: pointer; font-size: 0.85rem;
      display: flex; align-items: center; gap: 0.35rem;
      transition: background 0.15s, color 0.15s;
      white-space: nowrap;
    }
    .desk-nav button:hover { background: var(--surface2); color: var(--text); }
    .desk-nav button.active { background: var(--accent); color: #fff; }

    /* ---- Mobile nav ---- */
    .mob-nav {
      display: none;
      position: fixed; bottom: 0; left: 0; right: 0;
      background: var(--surface);
      border-top: 1px solid var(--border);
      z-index: 100; padding: 0.4rem 0.5rem;
    }
    .mob-nav-inner { display: flex; gap: 0.25rem; }
    .mob-nav button {
      background: none; border: none; color: var(--text2);
      padding: 0.45rem 0; border-radius: 8px;
      cursor: pointer; flex: 1;
      display: flex; flex-direction: column; align-items: center; gap: 0.2rem;
      font-size: 0.62rem; transition: color 0.15s;
    }
    .mob-nav button .ico { font-size: 1.25rem; line-height: 1; }
    .mob-nav button.active { color: var(--accent); }

    /* ---- Main ---- */
    main {
      flex: 1; padding: 1.5rem 1.25rem;
      max-width: 860px; margin: 0 auto; width: 100%;
    }

    /* ---- Views ---- */
    .view { display: none; }
    .view.active { display: block; }

    /* ---- Section header ---- */
    .sec-hdr {
      display: flex; align-items: center;
      justify-content: space-between; margin-bottom: 1rem;
    }
    .sec-title { font-size: 1.2rem; font-weight: 700; }

    /* ---- Cards ---- */
    .card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 1.25rem;
      margin-bottom: 1rem;
    }
    .card-hdr {
      display: flex; align-items: center;
      justify-content: space-between; margin-bottom: 0.9rem;
    }
    .card-title { font-size: 0.95rem; font-weight: 600; }

    /* ---- Buttons ---- */
    .btn {
      display: inline-flex; align-items: center; gap: 0.35rem;
      padding: 0.5rem 1rem; border-radius: 8px; border: none;
      cursor: pointer; font-size: 0.875rem; font-weight: 500;
      transition: filter 0.15s; text-decoration: none;
    }
    .btn-sm { padding: 0.3rem 0.65rem; font-size: 0.8rem; }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover { filter: brightness(1.15); }
    .btn-danger  { background: var(--danger); color: #fff; }
    .btn-danger:hover  { filter: brightness(1.15); }
    .btn-ghost   { background: var(--surface2); color: var(--text); }
    .btn-ghost:hover   { background: var(--border); }
    .btn-success { background: var(--success); color: #0f0f13; font-weight: 600; }
    .btn-success:hover { filter: brightness(1.1); }
    .btn-full { width: 100%; justify-content: center; }

    /* ---- Forms ---- */
    .fg { margin-bottom: 1rem; }
    .fg label { display: block; font-size: 0.82rem; color: var(--text2); margin-bottom: 0.3rem; }
    input, select, textarea {
      width: 100%; background: var(--surface2);
      border: 1px solid var(--border); color: var(--text);
      padding: 0.55rem 0.75rem; border-radius: 8px;
      font-size: 0.875rem; outline: none;
      transition: border-color 0.15s;
    }
    input:focus, select:focus, textarea:focus { border-color: var(--accent); }
    select option { background: var(--surface2); }
    input[type=number] { -moz-appearance: textfield; }
    input[type=number]::-webkit-inner-spin-button { opacity: 0.4; }

    /* ---- Stats grid ---- */
    .stats-grid {
      display: grid; grid-template-columns: repeat(3,1fr);
      gap: 0.75rem; margin-bottom: 1.25rem;
    }
    .stat-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 1rem; text-align: center;
    }
    .stat-num { font-size: 2rem; font-weight: 700; color: var(--accent); line-height: 1; }
    .stat-lbl { font-size: 0.72rem; color: var(--text2); margin-top: 0.25rem; }

    /* ---- Today card ---- */
    .today-card {
      background: linear-gradient(135deg, rgba(108,99,255,0.18), rgba(255,101,132,0.08));
      border: 1px solid rgba(108,99,255,0.35);
      border-radius: 14px; padding: 1.4rem;
      margin-bottom: 1.25rem;
    }
    .today-label { font-size: 0.72rem; color: var(--text2); text-transform: uppercase; letter-spacing: 0.07em; margin-bottom: 0.35rem; }
    .today-name { font-size: 1.05rem; font-weight: 700; margin-bottom: 0.4rem; }

    /* ---- Row ---- */
    .row {
      display: flex; align-items: center; gap: 0.6rem;
      padding: 0.55rem 0; border-bottom: 1px solid var(--border);
    }
    .row:last-child { border-bottom: none; }

    /* ---- Badges ---- */
    .badge {
      display: inline-block; padding: 0.18rem 0.55rem;
      border-radius: 999px; font-size: 0.68rem; font-weight: 600;
    }
    .badge-accent  { background: var(--accent-dim); color: var(--accent); }
    .badge-success { background: rgba(74,222,128,0.15); color: var(--success); }
    .badge-muscle  { background: var(--surface2); color: var(--text2); }

    /* ---- Week grid ---- */
    .week-grid {
      display: grid; grid-template-columns: repeat(7,1fr); gap: 0.5rem;
      margin-bottom: 1.25rem;
    }
    .day-cell {
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 8px; padding: 0.5rem;
      min-height: 76px; cursor: pointer;
      transition: border-color 0.15s;
    }
    .day-cell:hover  { border-color: var(--accent); }
    .day-cell.today  { border-color: var(--accent); }
    .day-cell.has-plan { background: var(--accent-dim); }
    .day-name { font-size: 0.68rem; color: var(--text2); text-transform: uppercase; letter-spacing: 0.05em; }
    .day-plan { font-size: 0.72rem; color: var(--accent); margin-top: 0.35rem; word-break: break-word; }

    /* ---- Active log ---- */
    .log-block {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 1rem;
      margin-bottom: 0.75rem;
    }
    .log-ex-title {
      font-weight: 600; font-size: 0.95rem;
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 0.7rem;
    }
    .col-labels {
      display: grid; grid-template-columns: 28px 1fr 1fr 32px;
      gap: 0.4rem; font-size: 0.68rem; color: var(--text2);
      text-transform: uppercase; letter-spacing: 0.05em;
      margin-bottom: 0.3rem;
    }
    .col-labels span { text-align: center; }
    .col-labels span:nth-child(2), .col-labels span:nth-child(3) { text-align: left; }
    .set-row {
      display: grid; grid-template-columns: 28px 1fr 1fr 32px;
      gap: 0.4rem; align-items: center; margin-bottom: 0.3rem;
    }
    .set-num { font-size: 0.78rem; color: var(--text2); text-align: center; }
    .set-row input { padding: 0.38rem 0.5rem; font-size: 0.85rem; text-align: center; }
    .chk {
      width: 28px; height: 28px; border-radius: 6px;
      border: 2px solid var(--border); background: none;
      cursor: pointer; display: flex; align-items: center;
      justify-content: center; transition: all 0.15s;
      font-size: 0.8rem; flex-shrink: 0;
    }
    .chk.done { background: var(--success); border-color: var(--success); color: #0f0f13; }

    /* ---- History ---- */
    .hist-item {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 0.9rem 1.1rem;
      margin-bottom: 0.6rem; display: flex;
      align-items: center; justify-content: space-between; gap: 1rem;
      cursor: pointer; transition: border-color 0.15s;
    }
    .hist-item:hover { border-color: var(--accent); }

    /* ---- Modal ---- */
    .modal-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.72); z-index: 200;
      align-items: center; justify-content: center; padding: 1rem;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 14px; padding: 1.5rem; width: 100%;
      max-width: 500px; max-height: 88vh; overflow-y: auto;
      box-shadow: 0 8px 40px rgba(0,0,0,0.6);
    }
    .modal-title { font-size: 1.05rem; font-weight: 700; margin-bottom: 1.2rem; }
    .modal-foot { display: flex; gap: 0.6rem; justify-content: flex-end; margin-top: 1.2rem; }

    /* ---- Empty state ---- */
    .empty {
      text-align: center; padding: 3rem 1rem; color: var(--text2);
    }
    .empty .ico { font-size: 2.8rem; margin-bottom: 0.65rem; }

    /* ---- Divider ---- */
    .div { height: 1px; background: var(--border); margin: 0.9rem 0; }

    /* ---- Canvas ---- */
    canvas { display: block; width: 100%; }

    /* ---- Utilities ---- */
    .flex { display: flex; }
    .flex-1 { flex: 1; }
    .gap-1 { gap: 0.5rem; }
    .gap-2 { gap: 1rem; }
    .items-center { align-items: center; }
    .justify-between { justify-content: space-between; }
    .mt-1 { margin-top: 0.5rem; }
    .mt-2 { margin-top: 1rem; }
    .text-sm { font-size: 0.875rem; }
    .text-xs { font-size: 0.75rem; }
    .text-muted { color: var(--text2); }
    .font-bold { font-weight: 700; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }
    .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0.75rem; }

    /* ---- Scrollbar ---- */
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    /* ---- Responsive ---- */
    @media (max-width: 640px) {
      .desk-nav { display: none; }
      .mob-nav  { display: block; }
      main { padding: 1rem; padding-bottom: 5.5rem; }
      .stats-grid { gap: 0.5rem; }
      .stat-num { font-size: 1.6rem; }
      .week-grid { gap: 0.25rem; }
      .day-cell  { padding: 0.35rem; min-height: 60px; }
      .day-name  { font-size: 0.58rem; }
      .day-plan  { font-size: 0.62rem; }
    }
  </style>
</head>
<body>

<header>
  <div class="logo">&#x1F4AA; Workout Planner</div>
  <nav class="desk-nav" id="deskNav">
    <button class="active" data-tab="dashboard">&#x1F3E0; Dashboard</button>
    <button data-tab="plans">&#x1F4CB; Plans</button>
    <button data-tab="schedule">&#x1F4C5; Schedule</button>
    <button data-tab="log">&#x25B6;&#xFE0F; Log</button>
    <button data-tab="history">&#x1F4CA; History</button>
  </nav>
</header>

<main>
  <!-- DASHBOARD -->
  <div id="view-dashboard" class="view active">
    <div class="stats-grid" id="statsGrid"></div>
    <div id="todaySection"></div>
    <div class="card">
      <div class="card-hdr"><span class="card-title">Recent Workouts</span></div>
      <div id="recentList"></div>
    </div>
  </div>

  <!-- PLANS -->
  <div id="view-plans" class="view">
    <div class="sec-hdr">
      <span class="sec-title">Workout Plans</span>
      <button class="btn btn-primary btn-sm" id="newPlanBtn">+ New Plan</button>
    </div>
    <div id="plansList"></div>
  </div>

  <!-- SCHEDULE -->
  <div id="view-schedule" class="view">
    <div class="sec-hdr">
      <span class="sec-title">Weekly Schedule</span>
      <span class="text-xs text-muted">Tap a day to assign</span>
    </div>
    <div class="week-grid" id="weekGrid"></div>
    <div class="card">
      <div class="card-title" style="margin-bottom:.75rem">Upcoming This Week</div>
      <div id="upcomingList"></div>
    </div>
  </div>

  <!-- LOG -->
  <div id="view-log" class="view">
    <div id="logContent"></div>
  </div>

  <!-- HISTORY -->
  <div id="view-history" class="view">
    <div class="sec-hdr"><span class="sec-title">Workout History</span></div>
    <div class="card" style="margin-bottom:1rem">
      <div class="card-title" style="margin-bottom:.85rem">Volume Over Time</div>
      <canvas id="chart" height="180"></canvas>
    </div>
    <div id="historyList"></div>
  </div>
</main>

<!-- Mobile nav -->
<nav class="mob-nav" id="mobNav">
  <div class="mob-nav-inner">
    <button class="active" data-tab="dashboard"><span class="ico">&#x1F3E0;</span>Home</button>
    <button data-tab="plans"><span class="ico">&#x1F4CB;</span>Plans</button>
    <button data-tab="schedule"><span class="ico">&#x1F4C5;</span>Schedule</button>
    <button data-tab="log"><span class="ico">&#x25B6;&#xFE0F;</span>Log</button>
    <button data-tab="history"><span class="ico">&#x1F4CA;</span>History</button>
  </div>
</nav>

<!-- ===== MODALS ===== -->

<!-- Plan create/edit -->
<div class="modal-overlay" id="planModal">
  <div class="modal">
    <div class="modal-title" id="planModalTitle">New Workout Plan</div>
    <div class="fg"><label>Plan Name</label><input type="text" id="planName" placeholder="e.g. Push Day, Leg Day"></div>
    <div class="fg"><label>Description (optional)</label><input type="text" id="planDesc" placeholder="Short description"></div>
    <div class="div"></div>
    <div class="flex items-center justify-between" style="margin-bottom:.7rem">
      <span class="text-sm font-bold">Exercises</span>
      <button class="btn btn-ghost btn-sm" id="addExBtn">+ Add Exercise</button>
    </div>
    <div id="planExList"></div>
    <div class="modal-foot">
      <button class="btn btn-ghost" id="cancelPlanBtn">Cancel</button>
      <button class="btn btn-primary" id="savePlanBtn">Save Plan</button>
    </div>
  </div>
</div>

<!-- Exercise picker -->
<div class="modal-overlay" id="exPickerModal">
  <div class="modal">
    <div class="modal-title">Add Exercise</div>
    <div class="fg"><label>Exercise</label><select id="exPicker"></select></div>
    <div class="grid-3">
      <div class="fg"><label>Sets</label><input type="number" id="exSets" value="3" min="1" max="20"></div>
      <div class="fg"><label>Reps</label><input type="number" id="exReps" value="10" min="1" max="100"></div>
      <div class="fg"><label>Weight (lbs)</label><input type="number" id="exWeight" value="0" min="0" step="2.5"></div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-ghost" id="cancelExPickerBtn">Cancel</button>
      <button class="btn btn-primary" id="confirmExPickerBtn">Add</button>
    </div>
  </div>
</div>

<!-- Custom exercise -->
<div class="modal-overlay" id="customExModal">
  <div class="modal">
    <div class="modal-title">New Custom Exercise</div>
    <div class="fg"><label>Name</label><input type="text" id="customExName" placeholder="Exercise name"></div>
    <div class="fg">
      <label>Muscle Group</label>
      <select id="customExMuscle">
        <option>Chest</option><option>Back</option><option>Shoulders</option>
        <option>Arms</option><option>Legs</option><option>Core</option>
        <option>Cardio</option><option>Full Body</option>
      </select>
    </div>
    <div class="modal-foot">
      <button class="btn btn-ghost" id="cancelCustomExBtn">Cancel</button>
      <button class="btn btn-primary" id="saveCustomExBtn">Add</button>
    </div>
  </div>
</div>

<!-- Schedule day -->
<div class="modal-overlay" id="schedModal">
  <div class="modal">
    <div class="modal-title" id="schedModalTitle">Assign Plan</div>
    <div class="fg"><label>Workout Plan</label>
      <select id="schedPlanPicker"></select>
    </div>
    <div class="modal-foot">
      <button class="btn btn-ghost" id="cancelSchedBtn">Cancel</button>
      <button class="btn btn-primary" id="saveSchedBtn">Save</button>
    </div>
  </div>
</div>

<!-- Start log -->
<div class="modal-overlay" id="startLogModal">
  <div class="modal">
    <div class="modal-title">Start Workout</div>
    <div class="fg"><label>Choose Plan</label><select id="logPlanPicker"></select></div>
    <div class="modal-foot">
      <button class="btn btn-ghost" id="cancelStartLogBtn">Cancel</button>
      <button class="btn btn-primary" id="confirmStartLogBtn">Start &#x25B6;</button>
    </div>
  </div>
</div>

<!-- Log detail -->
<div class="modal-overlay" id="logDetailModal">
  <div class="modal">
    <div class="modal-title" id="logDetailTitle">Workout Log</div>
    <div id="logDetailBody"></div>
    <div class="modal-foot">
      <button class="btn btn-danger btn-sm" id="deleteLogBtn">Delete</button>
      <button class="btn btn-ghost" id="closeLogDetailBtn">Close</button>
    </div>
  </div>
</div>

<script>
'use strict';

// ======================================================
// STORAGE
// ======================================================
const S = {
  get(k, def) {
    try { const v = localStorage.getItem('wp_' + k); return v !== null ? JSON.parse(v) : def; }
    catch { return def; }
  },
  set(k, v) {
    try { localStorage.setItem('wp_' + k, JSON.stringify(v)); } catch {}
  }
};

// ======================================================
// SEED DATA
// ======================================================
const SEED_EXERCISES = [
  {id:'e01',name:'Bench Press',mg:'Chest'},
  {id:'e02',name:'Incline Dumbbell Press',mg:'Chest'},
  {id:'e03',name:'Cable Fly',mg:'Chest'},
  {id:'e04',name:'Push-Up',mg:'Chest'},
  {id:'e05',name:'Pull-Up',mg:'Back'},
  {id:'e06',name:'Barbell Row',mg:'Back'},
  {id:'e07',name:'Lat Pulldown',mg:'Back'},
  {id:'e08',name:'Seated Cable Row',mg:'Back'},
  {id:'e09',name:'Deadlift',mg:'Back'},
  {id:'e10',name:'Overhead Press',mg:'Shoulders'},
  {id:'e11',name:'Lateral Raise',mg:'Shoulders'},
  {id:'e12',name:'Front Raise',mg:'Shoulders'},
  {id:'e13',name:'Face Pull',mg:'Shoulders'},
  {id:'e14',name:'Barbell Curl',mg:'Arms'},
  {id:'e15',name:'Hammer Curl',mg:'Arms'},
  {id:'e16',name:'Tricep Pushdown',mg:'Arms'},
  {id:'e17',name:'Skull Crushers',mg:'Arms'},
  {id:'e18',name:'Squat',mg:'Legs'},
  {id:'e19',name:'Leg Press',mg:'Legs'},
  {id:'e20',name:'Romanian Deadlift',mg:'Legs'},
  {id:'e21',name:'Leg Extension',mg:'Legs'},
  {id:'e22',name:'Leg Curl',mg:'Legs'},
  {id:'e23',name:'Calf Raise',mg:'Legs'},
  {id:'e24',name:'Plank',mg:'Core'},
  {id:'e25',name:'Crunch',mg:'Core'},
  {id:'e26',name:'Running',mg:'Cardio'},
  {id:'e27',name:'Jump Rope',mg:'Cardio'},
];

if (!S.get('init', false)) {
  S.set('exercises', SEED_EXERCISES);
  S.set('plans', []);
  S.set('schedule', {});
  S.set('logs', []);
  S.set('init', true);
}

// ======================================================
// STATE
// ======================================================
const ST = {
  tab: 'dashboard',
  editPlanId: null,
  editPlanExs: [],
  schedDay: null,
  activeLog: null,
  viewLogId: null,
};

// ======================================================
// UTILS
// ======================================================
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function todayStr() { return new Date().toISOString().slice(0,10); }
function dow() { return new Date().getDay(); }
const DAY3 = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const DAYF = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];

function fmtDate(iso) {
  return new Date(iso + 'T00:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
}
function fmtDur(ms) {
  if (!ms || ms < 0) return '';
  const m = Math.round(ms / 60000);
  return m < 60 ? `${m}m` : `${Math.floor(m/60)}h ${m%60}m`;
}
function volume(log) {
  return (log.exercises||[]).reduce((t,ex) =>
    t + (ex.sets||[]).reduce((s,st) => s + (st.done ? (st.reps||0)*(st.weight||0) : 0), 0), 0);
}
function getEx(id)  { return S.get('exercises',[]).find(e=>e.id===id); }
function getPlan(id){ return S.get('plans',[]).find(p=>p.id===id); }

// ======================================================
// TAB SWITCHING
// ======================================================
function switchTab(tab) {
  ST.tab = tab;
  document.querySelectorAll('[data-tab]').forEach(b =>
    b.classList.toggle('active', b.dataset.tab === tab));
  document.querySelectorAll('.view').forEach(v =>
    v.classList.toggle('active', v.id === 'view-' + tab));
  renderView(tab);
}

document.querySelectorAll('[data-tab]').forEach(b =>
  b.addEventListener('click', () => switchTab(b.dataset.tab)));

function renderView(tab) {
  if      (tab==='dashboard') renderDash();
  else if (tab==='plans')     renderPlans();
  else if (tab==='schedule')  renderSchedule();
  else if (tab==='log')       renderLog();
  else if (tab==='history')   renderHistory();
}

// ======================================================
// DASHBOARD
// ======================================================
function renderDash() {
  const logs = S.get('logs',[]);
  const td   = todayStr();
  const now  = new Date();
  const wkStart = new Date(now); wkStart.setDate(now.getDate()-now.getDay()); wkStart.setHours(0,0,0,0);
  const wkLogs = logs.filter(l => l.done && new Date(l.date+'T00:00:00') >= wkStart);

  // streak
  const doneDates = [...new Set(logs.filter(l=>l.done).map(l=>l.date))].sort().reverse();
  let streak = 0;
  let cur = new Date(td+'T00:00:00');
  for (const d of doneDates) {
    const diff = Math.round((cur - new Date(d+'T00:00:00'))/86400000);
    if (diff===0||diff===1) { streak++; cur = new Date(d+'T00:00:00'); }
    else break;
  }

  document.getElementById('statsGrid').innerHTML = `
    <div class="stat-card"><div class="stat-num">${wkLogs.length}</div><div class="stat-lbl">This Week</div></div>
    <div class="stat-card"><div class="stat-num">${streak}</div><div class="stat-lbl">Day Streak</div></div>
    <div class="stat-card"><div class="stat-num">${logs.filter(l=>l.done).length}</div><div class="stat-lbl">All Time</div></div>
  `;

  // today
  const sched    = S.get('schedule',{});
  const planId   = sched[dow()];
  const plan     = planId ? getPlan(planId) : null;
  const doneToday= logs.find(l=>l.date===td&&l.done);
  let todayHtml;
  if (doneToday) {
    todayHtml = `
      <div class="today-card">
        <div class="today-label">Today &mdash; ${DAYF[dow()]}</div>
        <div class="today-name">&#x2705; ${doneToday.planName||'Workout'} Complete!</div>
        <div class="text-sm text-muted">Great work. See you tomorrow.</div>
      </div>`;
  } else if (plan) {
    todayHtml = `
      <div class="today-card">
        <div class="today-label">Today &mdash; ${DAYF[dow()]}</div>
        <div class="today-name">${plan.name}</div>
        <div class="text-sm text-muted" style="margin-bottom:.85rem">${plan.exercises.length} exercise${plan.exercises.length!==1?'s':''}</div>
        <button class="btn btn-primary btn-sm" onclick="startLogWith('${plan.id}')">&#x25B6; Start Workout</button>
      </div>`;
  } else {
    todayHtml = `
      <div class="today-card">
        <div class="today-label">Today &mdash; ${DAYF[dow()]}</div>
        <div class="today-name">Rest Day</div>
        <div class="text-sm text-muted" style="margin-bottom:.85rem">No plan scheduled &mdash; or start an ad-hoc session.</div>
        <button class="btn btn-ghost btn-sm" onclick="switchTab('log')">&#x25B6; Start Ad-hoc</button>
      </div>`;
  }
  document.getElementById('todaySection').innerHTML = todayHtml;

  // recent
  const recent = [...logs].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,5);
  document.getElementById('recentList').innerHTML = recent.length ? recent.map(l => `
    <div class="row">
      <span class="flex-1 text-sm">${l.planName||'Workout'}</span>
      <span class="text-xs text-muted">${fmtDate(l.date)}</span>
      <span class="badge ${l.done?'badge-success':'badge-accent'}">${l.done?'Done':'In progress'}</span>
    </div>`).join('')
    : '<p class="text-sm text-muted">No workouts logged yet. Start your first one!</p>';
}

// ======================================================
// PLANS
// ======================================================
function renderPlans() {
  const plans = S.get('plans',[]);
  const el = document.getElementById('plansList');
  if (!plans.length) {
    el.innerHTML = '<div class="empty"><div class="ico">&#x1F4CB;</div><div>No plans yet</div><p class="text-xs mt-1">Create your first workout plan</p></div>';
    return;
  }
  el.innerHTML = plans.map(p => {
    const preview = p.exercises.slice(0,3).map(e=>{
      const ex=getEx(e.exerciseId); return ex?ex.name:'?';
    }).join(', ') + (p.exercises.length>3 ? ` +${p.exercises.length-3} more` : '');
    return `
      <div class="card">
        <div class="card-hdr">
          <span class="card-title">${p.name}</span>
          <div class="flex gap-1">
            <button class="btn btn-ghost btn-sm" onclick="openEditPlan('${p.id}')">Edit</button>
            <button class="btn btn-danger btn-sm" onclick="deletePlan('${p.id}')">Delete</button>
          </div>
        </div>
        ${p.desc?`<p class="text-sm text-muted" style="margin-bottom:.5rem">${p.desc}</p>`:''}
        <p class="text-xs text-muted">${p.exercises.length} exercises${p.exercises.length?': '+preview:''}</p>
        <div style="margin-top:.75rem">
          <button class="btn btn-primary btn-sm" onclick="startLogWith('${p.id}')">&#x25B6; Start</button>
        </div>
      </div>`;
  }).join('');
}

function openNewPlan() {
  ST.editPlanId = null; ST.editPlanExs = [];
  document.getElementById('planModalTitle').textContent = 'New Workout Plan';
  document.getElementById('planName').value = '';
  document.getElementById('planDesc').value = '';
  renderPlanExs();
  open('planModal');
}
function openEditPlan(id) {
  const p = getPlan(id); if(!p) return;
  ST.editPlanId = id;
  ST.editPlanExs = JSON.parse(JSON.stringify(p.exercises));
  document.getElementById('planModalTitle').textContent = 'Edit Plan';
  document.getElementById('planName').value = p.name;
  document.getElementById('planDesc').value = p.desc||'';
  renderPlanExs();
  open('planModal');
}
function renderPlanExs() {
  const el = document.getElementById('planExList');
  if (!ST.editPlanExs.length) {
    el.innerHTML = '<p class="text-sm text-muted" style="padding:.4rem 0">No exercises added yet.</p>'; return;
  }
  el.innerHTML = ST.editPlanExs.map((e,i) => {
    const ex=getEx(e.exerciseId);
    return `<div class="row">
      <span class="flex-1 text-sm">${ex?ex.name:'?'}</span>
      <span class="text-xs text-muted">${e.sets}&times;${e.reps} @ ${e.weight}lb</span>
      <button class="btn btn-ghost btn-sm" onclick="removePlanEx(${i})">&#x2715;</button>
    </div>`;
  }).join('');
}
function removePlanEx(i) { ST.editPlanExs.splice(i,1); renderPlanExs(); }
function deletePlan(id) {
  if(!confirm('Delete this plan?')) return;
  S.set('plans', S.get('plans',[]).filter(p=>p.id!==id));
  const sc=S.get('schedule',{});
  Object.keys(sc).forEach(k=>{ if(sc[k]===id) delete sc[k]; });
  S.set('schedule',sc);
  renderPlans();
}

document.getElementById('newPlanBtn').addEventListener('click', openNewPlan);
document.getElementById('cancelPlanBtn').addEventListener('click', ()=>close('planModal'));
document.getElementById('savePlanBtn').addEventListener('click', ()=>{
  const name = document.getElementById('planName').value.trim();
  if (!name) { alert('Enter a plan name.'); return; }
  const plans = S.get('plans',[]);
  const obj = { name, desc: document.getElementById('planDesc').value.trim(), exercises: ST.editPlanExs };
  if (ST.editPlanId) {
    const i = plans.findIndex(p=>p.id===ST.editPlanId);
    if (i>=0) plans[i] = {...plans[i],...obj};
  } else {
    plans.push({id:uid(),...obj});
  }
  S.set('plans',plans); close('planModal'); renderPlans();
});
document.getElementById('addExBtn').addEventListener('click', ()=>{
  const exs = S.get('exercises',[]);
  const pk  = document.getElementById('exPicker');
  pk.innerHTML = exs.map(e=>`<option value="${e.id}">${e.name} (${e.mg})</option>`).join('')
    + '<option value="__new__">+ Add Custom Exercise...</option>';
  document.getElementById('exSets').value=3;
  document.getElementById('exReps').value=10;
  document.getElementById('exWeight').value=0;
  open('exPickerModal');
});
document.getElementById('cancelExPickerBtn').addEventListener('click',()=>close('exPickerModal'));
document.getElementById('confirmExPickerBtn').addEventListener('click',()=>{
  const id=document.getElementById('exPicker').value;
  if (id==='__new__') { close('exPickerModal'); open('customExModal'); return; }
  ST.editPlanExs.push({
    exerciseId:id,
    sets:parseInt(document.getElementById('exSets').value)||3,
    reps:parseInt(document.getElementById('exReps').value)||10,
    weight:parseFloat(document.getElementById('exWeight').value)||0,
  });
  close('exPickerModal'); renderPlanExs();
});
document.getElementById('cancelCustomExBtn').addEventListener('click',()=>{ close('customExModal'); open('exPickerModal'); });
document.getElementById('saveCustomExBtn').addEventListener('click',()=>{
  const name=document.getElementById('customExName').value.trim();
  if(!name){alert('Enter a name.');return;}
  const exs=S.get('exercises',[]);
  const ne={id:uid(),name,mg:document.getElementById('customExMuscle').value};
  exs.push(ne); S.set('exercises',exs);
  document.getElementById('customExName').value='';
  const pk=document.getElementById('exPicker');
  pk.innerHTML=exs.map(e=>`<option value="${e.id}">${e.name} (${e.mg})</option>`).join('')
    +'<option value="__new__">+ Add Custom Exercise...</option>';
  pk.value=ne.id;
  close('customExModal'); open('exPickerModal');
});

// ======================================================
// SCHEDULE
// ======================================================
function renderSchedule() {
  const sc=S.get('schedule',{}), plans=S.get('plans',[]), today=dow();
  document.getElementById('weekGrid').innerHTML = DAY3.map((d,i)=>{
    const pid=sc[i], plan=pid?plans.find(p=>p.id===pid):null;
    return `<div class="day-cell ${i===today?'today':''} ${plan?'has-plan':''}" onclick="openSchedModal(${i})">
      <div class="day-name">${d}</div>
      ${plan?`<div class="day-plan">${plan.name}</div>`:''}
    </div>`;
  }).join('');

  const upcoming=[];
  for(let o=0;o<7;o++){
    const di=(today+o)%7, pid=sc[di];
    if(pid){ const p=plans.find(x=>x.id===pid); if(p) upcoming.push({day:DAYF[di],plan:p,isToday:o===0}); }
  }
  const ul=document.getElementById('upcomingList');
  ul.innerHTML=upcoming.length ? upcoming.map(u=>`
    <div class="row">
      <span class="text-sm font-bold" style="width:90px">${u.day}</span>
      <span class="flex-1 text-sm">${u.plan.name}</span>
      ${u.isToday?'<span class="badge badge-accent">Today</span>':''}
    </div>`).join('')
    : '<p class="text-sm text-muted">No plans assigned. Tap a day above.</p>';
}
function openSchedModal(day) {
  ST.schedDay=day;
  document.getElementById('schedModalTitle').textContent=`${DAYF[day]} — Assign Plan`;
  const plans=S.get('plans',[]), sc=S.get('schedule',{});
  const pk=document.getElementById('schedPlanPicker');
  pk.innerHTML='<option value="">&#x2014; Rest Day &#x2014;</option>'+plans.map(p=>`<option value="${p.id}">${p.name}</option>`).join('');
  pk.value=sc[day]||'';
  open('schedModal');
}
document.getElementById('cancelSchedBtn').addEventListener('click',()=>close('schedModal'));
document.getElementById('saveSchedBtn').addEventListener('click',()=>{
  const sc=S.get('schedule',{}), v=document.getElementById('schedPlanPicker').value;
  if(v) sc[ST.schedDay]=v; else delete sc[ST.schedDay];
  S.set('schedule',sc); close('schedModal'); renderSchedule();
});

// LOG
// ======================================================
function renderLog() {
  const el=document.getElementById('logContent');
  if (ST.activeLog) { renderActiveLog(el); return; }
  const plans=S.get('plans',[]);
  if (!plans.length) {
    el.innerHTML=`<div class="empty"><div class="ico">&#x25B6;&#xFE0F;</div><div>No plans yet</div>
      <p class="text-xs mt-1">Create a plan first</p>
      <button class="btn btn-primary" style="margin-top:1rem" onclick="switchTab('plans')">Go to Plans</button></div>`;
  } else {
    el.innerHTML=`
      <div class="sec-hdr"><span class="sec-title">Log Workout</span></div>
      <div class="today-card" style="text-align:center;padding:2rem 1.5rem">
        <div style="font-size:2.5rem;margin-bottom:.75rem">&#x1F4AA;</div>
        <div style="font-size:1.05rem;font-weight:700;margin-bottom:1rem">Ready to train?</div>
        <button class="btn btn-primary" onclick="openStartLogModal()">Select &amp; Start Workout</button>
      </div>`;
  }
}
function renderActiveLog(el) {
  const log=ST.activeLog;
  const elapsed=fmtDur(Date.now()-log.startTime);
  el.innerHTML=`
    <div class="sec-hdr">
      <span class="sec-title">${log.planName}</span>
      <span class="text-sm text-muted" id="timerDisplay">${elapsed ? '&#x23F1; '+elapsed : 'Starting...'}</span>
    </div>
    ${log.exercises.map((ex,ei)=>`
      <div class="log-block">
        <div class="log-ex-title">
          <span>${ex.name}</span>
          <span class="badge badge-muscle">${ex.mg||''}</span>
        </div>
        <div class="col-labels"><span>#</span><span>Reps</span><span>Weight (lbs)</span><span>&#x2713;</span></div>
        ${ex.sets.map((s,si)=>`
          <div class="set-row">
            <span class="set-num">${si+1}</span>
            <input type="number" value="${s.reps}" min="0" placeholder="Reps"
              oninput="setVal(${ei},${si},'reps',this.value)">
            <input type="number" value="${s.weight}" min="0" step="2.5" placeholder="lbs"
              oninput="setVal(${ei},${si},'weight',this.value)">
            <button type="button" class="chk ${s.done?'done':''}" onclick="toggleSet(${ei},${si})">${s.done?'&#x2713;':''}</button>
          </div>`).join('')}
        <button class="btn btn-ghost btn-sm" style="margin-top:.5rem" onclick="addSet(${ei})">+ Set</button>
      </div>`).join('')}
    <div class="flex gap-1" style="margin-top:1rem">
      <button class="btn btn-ghost flex-1" onclick="cancelLog()">Cancel</button>
      <button class="btn btn-success flex-1" onclick="finishLog()">&#x2705; Finish Workout</button>
    </div>`;
}

function startLogWith(planId) {
  const plan=getPlan(planId); if(!plan) return;
  ST.activeLog={
    id:uid(), date:todayStr(), planId:plan.id, planName:plan.name,
    startTime:Date.now(),
    exercises:plan.exercises.map(e=>{
      const ex=getEx(e.exerciseId);
      return {
        exerciseId:e.exerciseId,
        name:ex?ex.name:'Exercise',
        mg:ex?ex.mg:'',
        sets:Array.from({length:e.sets},()=>({reps:e.reps,weight:e.weight,done:false}))
      };
    }),
    done:false,
  };
  switchTab('log');
}
function openStartLogModal() {
  const plans=S.get('plans',[]);
  const pk=document.getElementById('logPlanPicker');
  pk.innerHTML=plans.map(p=>`<option value="${p.id}">${p.name}</option>`).join('');
  open('startLogModal');
}
function setVal(ei,si,field,val) {
  if(!ST.activeLog) return;
  ST.activeLog.exercises[ei].sets[si][field]=field==='reps'?parseInt(val)||0:parseFloat(val)||0;
}
function toggleSet(ei,si) {
  if(!ST.activeLog) return;
  ST.activeLog.exercises[ei].sets[si].done=!ST.activeLog.exercises[ei].sets[si].done;
  renderActiveLog(document.getElementById('logContent'));
}
function addSet(ei) {
  if(!ST.activeLog) return;
  const sets=ST.activeLog.exercises[ei].sets;
  const last=sets[sets.length-1]||{reps:10,weight:0};
  sets.push({reps:last.reps,weight:last.weight,done:false});
  renderActiveLog(document.getElementById('logContent'));
}
function cancelLog()  { if(!confirm('Cancel this workout?')) return; ST.activeLog=null; renderLog(); }
function finishLog()  {
  if(!ST.activeLog) return;
  ST.activeLog.done=true; ST.activeLog.endTime=Date.now();
  const logs=S.get('logs',[]); logs.push(ST.activeLog); S.set('logs',logs);
  ST.activeLog=null; switchTab('history');
}

document.getElementById('cancelStartLogBtn').addEventListener('click',()=>close('startLogModal'));
document.getElementById('confirmStartLogBtn').addEventListener('click',()=>{
  const id=document.getElementById('logPlanPicker').value;
  close('startLogModal'); startLogWith(id);
});

// keep timer ticking
setInterval(()=>{
  if(ST.activeLog && ST.tab==='log'){
    const el=document.getElementById('timerDisplay');
    if(el) el.innerHTML='&#x23F1; '+fmtDur(Date.now()-ST.activeLog.startTime);
  }
},30000);

// ======================================================
// HISTORY
// ======================================================
function renderHistory() {
  const logs=S.get('logs',[]).filter(l=>l.done);
  const sorted=[...logs].sort((a,b)=>b.date.localeCompare(a.date));
  drawChart(sorted);
  const el=document.getElementById('historyList');
  if(!sorted.length){
    el.innerHTML='<div class="empty"><div class="ico">&#x1F4CA;</div><div>No completed workouts yet</div></div>';
    return;
  }
  el.innerHTML=sorted.map(l=>{
    const vol=volume(l);
    const sets=l.exercises.reduce((s,ex)=>s+ex.sets.filter(st=>st.done).length,0);
    return `<div class="hist-item" onclick="viewLog('${l.id}')">
      <div>
        <div class="text-sm font-bold">${l.planName||'Workout'}</div>
        <div class="text-xs text-muted" style="margin-top:.2rem">${fmtDate(l.date)}</div>
      </div>
      <div style="text-align:right">
        <div class="text-sm">${sets} sets completed</div>
        ${vol>0?`<div class="text-xs text-muted">${vol.toLocaleString()} lbs volume</div>`:''}
      </div>
    </div>`;
  }).join('');
}

function drawChart(logs) {
  const canvas=document.getElementById('chart');
  if(!canvas) return;
  const ctx=canvas.getContext('2d');
  const dpr=window.devicePixelRatio||1;
  // Use clientWidth or fallback
  const W=canvas.parentElement.clientWidth||600;
  const H=180;
  canvas.width=W*dpr; canvas.height=H*dpr;
  canvas.style.width=W+'px'; canvas.style.height=H+'px';
  ctx.scale(dpr,dpr);
  ctx.clearRect(0,0,W,H);

  const recent=[...logs].reverse().slice(0,20);
  if(recent.length<2){
    ctx.fillStyle='#9090a8'; ctx.font='13px sans-serif'; ctx.textAlign='center';
    ctx.fillText('Complete more workouts to see your progress chart',W/2,H/2);
    return;
  }
  const vols=recent.map(l=>volume(l));
  const maxV=Math.max(...vols,1);
  const pL=52,pR=16,pT=16,pB=28;
  const cW=W-pL-pR, cH=H-pT-pB;

  // gridlines + y-axis labels
  ctx.strokeStyle='#2e2e42'; ctx.lineWidth=1;
  for(let i=0;i<=4;i++){
    const y=pT+cH*i/4;
    ctx.beginPath(); ctx.moveTo(pL,y); ctx.lineTo(pL+cW,y); ctx.stroke();
    ctx.fillStyle='#9090a8'; ctx.font='10px sans-serif'; ctx.textAlign='right';
    ctx.fillText(Math.round(maxV*(1-i/4)).toLocaleString(),pL-5,y+4);
  }

  // bars
  const bw=Math.max(4, cW/recent.length-4);
  recent.forEach((l,i)=>{
    const x=pL+i/(recent.length-1)*cW-bw/2;
    const bh=vols[i]/maxV*cH;
    ctx.fillStyle='rgba(108,99,255,0.45)';
    ctx.fillRect(x, pT+cH-bh, bw, bh);
  });

  // line
  ctx.strokeStyle='#6c63ff'; ctx.lineWidth=2.5; ctx.lineJoin='round';
  ctx.beginPath();
  recent.forEach((l,i)=>{
    const x=pL+i/(recent.length-1)*cW;
    const y=pT+cH-vols[i]/maxV*cH;
    i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
  }); ctx.stroke();

  // dots
  recent.forEach((l,i)=>{
    const x=pL+i/(recent.length-1)*cW;
    const y=pT+cH-vols[i]/maxV*cH;
    ctx.fillStyle='#6c63ff';
    ctx.beginPath(); ctx.arc(x,y,4,0,Math.PI*2); ctx.fill();
    ctx.fillStyle=getComputedStyle(document.documentElement).getPropertyValue('--bg')||'#0f0f13';
    ctx.beginPath(); ctx.arc(x,y,2,0,Math.PI*2); ctx.fill();
  });

  // x labels
  ctx.fillStyle='#9090a8'; ctx.font='9px sans-serif'; ctx.textAlign='center';
  const step=Math.ceil(recent.length/5);
  recent.forEach((l,i)=>{
    if(i%step===0||i===recent.length-1){
      const x=pL+i/(recent.length-1)*cW;
      const d=new Date(l.date+'T00:00:00');
      ctx.fillText(`${d.getMonth()+1}/${d.getDate()}`,x,H-6);
    }
  });
}

function viewLog(id) {
  const log=S.get('logs',[]).find(l=>l.id===id); if(!log) return;
  ST.viewLogId=id;
  const dur=log.startTime&&log.endTime?fmtDur(log.endTime-log.startTime):'';
  const vol=volume(log);
  document.getElementById('logDetailTitle').textContent=`${log.planName||'Workout'} — ${fmtDate(log.date)}`;
  document.getElementById('logDetailBody').innerHTML=`
    <div class="flex gap-1" style="margin-bottom:.85rem;flex-wrap:wrap">
      ${dur?`<span class="badge badge-accent">&#x23F1; ${dur}</span>`:''}
      ${vol>0?`<span class="badge badge-success">${vol.toLocaleString()} lbs total volume</span>`:''}
    </div>
    ${log.exercises.map(ex=>`
      <div style="margin-bottom:.85rem">
        <div class="text-sm font-bold" style="margin-bottom:.35rem">${ex.name} <span class="badge badge-muscle">${ex.mg||''}</span></div>
        ${ex.sets.map((s,i)=>`
          <div class="text-xs" style="padding:.2rem 0;color:${s.done?'var(--text)':'var(--text2)'}">
            Set ${i+1}: ${s.reps} reps &times; ${s.weight} lbs ${s.done?'&#x2705;':'&#x25CB;'}
          </div>`).join('')}
      </div>`).join('')}`;
  open('logDetailModal');
}
document.getElementById('closeLogDetailBtn').addEventListener('click',()=>close('logDetailModal'));
document.getElementById('deleteLogBtn').addEventListener('click',()=>{
  if(!confirm('Delete this workout log?')) return;
  S.set('logs',S.get('logs',[]).filter(l=>l.id!==ST.viewLogId));
  close('logDetailModal'); renderHistory();
});
